name: "sht4x-trinkey"
description: "Publishes temperature, relative humidity and raw capacitive touch from an Adafruit SHT4x Trinkey attached over USB serial."
keywords: "sht4x, sensirion, adafruit, trinkey, temperature, humidity, usb, serial, environmental"
authors: "Rajesh Sankaran <sankaran@anl.gov>"
collaborators: ""
funding: ""
license: "MIT"
homepage: "https://github.com/waggle-sensor/plugin-sht4x-trinkey/blob/main/README.md"
source:
  architectures:
    - "linux/amd64"
    - "linux/arm64"
  directory: "."
  dockerfile: "Dockerfile"
  url: "https://github.com/waggle-sensor/plugin-sht4x-trinkey.git"
  branch: "main"
inputs:
  - id: "device"
    type: "string"
    default: "/dev/ttyACM0"
  - id: "publish-interval"
    type: "string"
    default: "30"
  - id: "aggregate"
    type: "string"
    default: "mean"
